site_name: MuhammaraJS Documentation
site_description: Documentation for the MuhammaraJS native Node.js and WebAssembly PDF packages.
site_url: https://muhammarajs.readthedocs.io/
site_dir: site
docs_dir: docs/.staging
use_directory_urls: false
repo_name: julianhille/MuhammaraJS
repo_url: https://github.com/julianhille/MuhammaraJS

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.tabs
    - search.highlight
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  links:
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Native Node.js:
      - Overview: native/index.md
      - Getting Started:
          - Overview: native/getting-started/index.md
          - Installation: native/getting-started/installation.md
          - Migrate to @muhammara/native: native/getting-started/migrate-to-scoped-package.md
          - Migrate from HummusJS: native/getting-started/migrate-from-hummusjs.md
          - Migrate from Recipe Modules: native/getting-started/migrate-from-recipe-modules.md
      - High-Level Recipe:
          - Overview: native/recipe/index.md
          - Invariants: native/recipe/invariants.md
          - Create PDFs: native/recipe/create-pdfs.md
          - Text and Fonts: native/recipe/text-and-fonts.md
          - Colors, Shapes, and Vectors: native/recipe/colors-shapes-and-vectors.md
          - Pages and Positioning: native/recipe/pages-and-positioning.md
          - Metadata and Custom Data: native/recipe/metadata-and-custom-data.md
          - Modify and Inspect PDFs: native/recipe/modify-and-inspect.md
          - Compose PDFs: native/recipe/compose-pdfs.md
          - Encrypt PDFs: native/recipe/encryption.md
          - Generated API Reference: native/recipe/reference.md
      - Low-Level API:
          - Overview: native/low-level/index.md
          - Invariants: native/low-level/invariants.md
          - Create a PDF: native/low-level/create-a-pdf.md
          - Draw Text: native/low-level/text.md
          - Draw Primitives: native/low-level/drawing-primitives.md
          - Draw Images: native/low-level/images.md
          - Form XObjects: native/low-level/form-xobjects.md
          - PDF Drawing Operators: native/low-level/pdf-operators.md
          - Copy and Embed PDFs: native/low-level/copy-and-embed-pdfs.md
          - Read PDFs: native/low-level/read-pdfs.md
          - Modify PDFs: native/low-level/modify-pdfs.md
          - Custom Streams: native/low-level/custom-streams.md
          - Write PDF Objects: native/low-level/write-pdf-objects.md
      - API Reference:
          - Overview: native/api/index.md
          - PDF Writer: native/api/writer.md
          - PDF Reader and Objects: native/api/reader-and-objects.md
          - Content Contexts: native/api/content-contexts.md
          - Copying and Modification: native/api/copying-and-modification.md
          - Stream Interfaces: native/api/streams.md
          - Options and Constants: native/api/options-and-constants.md
          - Type Declarations Reference: native/api/type-declarations.md
      - How-To Guides:
          - Overview: native/how-to/index.md
          - Serve a PDF Response: native/how-to/serve-a-pdf-response.md
          - Add Review Annotations: native/how-to/add-review-annotations.md
          - Create Multi-Page Tables: native/how-to/create-tables.md
          - Flow Text into Columns: native/how-to/flow-text-into-columns.md
          - Watermark Every Page: native/how-to/watermark-pdfs.md
          - Find Text Positions: native/how-to/find-text-positions.md
          - Add Clickable URL Links: native/how-to/add-url-links.md
          - Change PDF Passwords: native/how-to/change-pdf-passwords.md
          - Add Content to Rotated Pages: native/how-to/add-content-to-rotated-pages.md
          - Place and Transform Images: native/how-to/place-and-transform-images.md
          - Set Page Boxes: native/how-to/set-page-boxes.md
          - Requested Workflow Backlog: native/how-to/backlog.md
      - Project:
          - Breaking Changes: native/breaking-changes.md
          - Contributing Documentation: native/contributing.md
          - Documentation Sources: native/provenance.md
  - Project:
      - Development Commands: development.md
      - Security and Vendored Dependencies: security.md
      - Current Changelog: https://github.com/julianhille/MuhammaraJS/blob/develop/CHANGELOG.md
