name: Native CI

on:
  push:
    branches:
      - develop
    tags:
      - "native-v*"
  pull_request:
    paths:
      - ".github/workflows/ci-native.yml"
      - "packages/native/**"
      - "!packages/native/docs/**"
      - "!packages/native/mkdocs.yml"
      - "!packages/native/.readthedocs.yaml"
      - "packages/native-core/**"
      - "packages/native-with-source/**"
      - ".github/actions/setup-native-build-cache/**"
      - ".github/scripts/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NAPI_VERSION: 8

jobs:
  packed-source-fallback:
    needs: build-prebuild-glibc
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: ./.github/actions/setup-native-build-cache
        with:
          key: native-source-${{ hashFiles('packages/native-with-source/binding.gyp', 'packages/native-with-source/src/**') }}
          restore-keys: native-source-
      - run: sudo apt-get update && sudo apt-get install -y perl
      - run: npm ci --ignore-scripts
      - run: npm run native:test:types && npm run native-with-source:test:types
      - run: npm exec --workspace=@muhammara/native-with-source -- node-pre-gyp rebuild
      - name: Verify OpenSSL is statically linked
        run: if readelf -d packages/native-with-source/binding/napi-v${{ env.NAPI_VERSION }}/muhammara.node | grep -Eiq 'lib(crypto|ssl)'; then exit 1; fi
      - run: mkdir -p packages && npm pack --workspace=@muhammara/native-core --pack-destination packages && npm pack --workspace=@muhammara/native-with-source --pack-destination packages && npm pack --workspace=@muhammara/native --pack-destination packages
      - name: Verify native package contents
        run: tar -tzf packages/muhammara-native-with-source-*.tgz | grep -q package/src/ && tar -tzf packages/muhammara-native-with-source-*.tgz | grep -q package/THIRD_PARTY_NOTICES.md && tar -tzf packages/muhammara-native-core-*.tgz | grep -q package/lib/ && tar -tzf packages/muhammara-native-core-*.tgz | grep -q package/THIRD_PARTY_NOTICES.md && tar -tzf packages/muhammara-native-[0-9]*.tgz | grep -q package/THIRD_PARTY_NOTICES.md
      - name: Install packed package without prebuilds
        run: mkdir -p /tmp/muhammara-source-fallback && npm install --build-from-source --prefix /tmp/muhammara-source-fallback ./packages/muhammara-native-core-*.tgz ./packages/muhammara-native-with-source-*.tgz
      - run: node -e "require('/tmp/muhammara-source-fallback/node_modules/@muhammara/native-with-source')"
      - name: Verify source cleanup preserves the addon
        run: /tmp/muhammara-source-fallback/node_modules/.bin/muhammara-clean-source && test ! -d /tmp/muhammara-source-fallback/node_modules/@muhammara/native-with-source/src && test ! -d /tmp/muhammara-source-fallback/node_modules/@muhammara/native-with-source/openssl-build && node -e "require('/tmp/muhammara-source-fallback/node_modules/@muhammara/native-with-source')"
      - name: Rebuild the source package through the native alias directory
        run: |
          mkdir -p /tmp/muhammara-electron-alias
          npm install --ignore-scripts --prefix /tmp/muhammara-electron-alias ./packages/muhammara-native-core-*.tgz ./packages/muhammara-native-with-source-*.tgz
          mv /tmp/muhammara-electron-alias/node_modules/@muhammara/native-with-source /tmp/muhammara-electron-alias/node_modules/@muhammara/native
          node -e "var fs = require('fs'); var packagePath = '/tmp/muhammara-electron-alias/package.json'; var packageManifest = require(packagePath); var aliasPath = '/tmp/muhammara-electron-alias/node_modules/@muhammara/native/package.json'; var aliasManifest = require(aliasPath); packageManifest.dependencies = {'@muhammara/native': 'npm:@muhammara/native-with-source@' + aliasManifest.version}; fs.writeFileSync(packagePath, JSON.stringify(packageManifest, null, 2) + '\\n'); aliasManifest.name = '@muhammara/native'; fs.writeFileSync(aliasPath, JSON.stringify(aliasManifest, null, 2) + '\\n');"
          npm exec --yes --prefix /tmp/muhammara-electron-alias --package=@electron/rebuild -- electron-rebuild -f --build-from-source -w @muhammara/native --version 38.1.0 --module-dir /tmp/muhammara-electron-alias
          test -f /tmp/muhammara-electron-alias/node_modules/@muhammara/native/build/Release/muhammara.node
      - name: Verify slim package excludes source-build inputs
        run: mkdir -p /tmp/muhammara-slim-package && npm install --ignore-scripts --prefix /tmp/muhammara-slim-package ./packages/muhammara-native-core-*.tgz ./packages/muhammara-native-[0-9]*.tgz && test "$(node -p "require('/tmp/muhammara-slim-package/node_modules/@muhammara/native/package.json').name")" = "@muhammara/native" && test ! -d /tmp/muhammara-slim-package/node_modules/@muhammara/native/src && test ! -e /tmp/muhammara-slim-package/node_modules/@muhammara/native/binding.gyp
      - uses: actions/download-artifact@v8
        with:
          name: prebuild-napi-v${{ env.NAPI_VERSION }}-linux-x64-glibc
          path: canonical-prebuild
      - name: Stage canonical prebuild for the package installer
        run: |
          version="$(node -p "require('./packages/native/package.json').version")"
          destination="packages/native-with-source/build/stage/julianhille/MuhammaraJS/releases/download/native-v$version"
          mkdir -p "$destination"
          cp canonical-prebuild/napi-v${{ env.NAPI_VERSION }}-linux-x64-glibc.tar.gz "$destination/"
      - name: Install slim package from a matching prebuild
        run: |
          python3 -m http.server 8080 --directory packages/native-with-source/build/stage >/tmp/muhammara-prebuild-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          mkdir -p /tmp/muhammara-slim-prebuilt
          npm install --prefix /tmp/muhammara-slim-prebuilt ./packages/muhammara-native-core-*.tgz ./packages/muhammara-native-[0-9]*.tgz
          node -e "require('/tmp/muhammara-slim-prebuilt/node_modules/@muhammara/native')"
        env:
          npm_config_muhammara_binary_host_mirror: http://127.0.0.1:8080
      - name: Verify missing slim prebuild gives migration instructions
        run: |
          mkdir -p /tmp/muhammara-slim-no-prebuild
          if npm install --prefix /tmp/muhammara-slim-no-prebuild ./packages/muhammara-native-core-*.tgz ./packages/muhammara-native-[0-9]*.tgz >/tmp/muhammara-slim-no-prebuild.log 2>&1; then
            exit 1
          fi
          node -e "var output = require('fs').readFileSync('/tmp/muhammara-slim-no-prebuild.log', 'utf8'); if (!output.includes('@muhammara/native-with-source') || !output.includes('npm install @muhammara/native@npm:@muhammara/native-with-source@')) process.exit(1);"
        env:
          npm_config_muhammara_binary_host_mirror: http://127.0.0.1:9
  sanitizer:
    runs-on: ubuntu-22.04
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
      LSAN_OPTIONS: print_suppressions=0
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: ./.github/actions/setup-native-build-cache
        with:
          key: native-sanitizer-${{ hashFiles('packages/native-with-source/binding.gyp', 'packages/native-with-source/src/**') }}
          restore-keys: native-sanitizer-
      - run: sudo apt-get update && sudo apt-get install -y perl
      - run: npm ci --ignore-scripts
      - name: Build with sanitizers
        run: npm exec --workspace=@muhammara/native-with-source -- node-pre-gyp rebuild
        env:
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
      - name: Run tests with the sanitizer runtime preloaded
        working-directory: packages/native-with-source
        run: LD_PRELOAD="$(gcc -print-file-name=libasan.so)" node --expose-gc ../../node_modules/mocha/bin/mocha.js --require ./tests/hooks/sanitizer-gc.js -R tap --recursive ./tests --timeout 15000
  build-prebuild-glibc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: x64
            extra_compile_flags: ""
          - runner: ubuntu-22.04-arm
            architecture: arm64
            extra_compile_flags: -march=armv8-a
    runs-on: ${{ matrix.runner }}
    container:
      image: gcc:11-bullseye
      credentials:
        username: "${{ secrets.DOCKER_USERNAME }}"
        password: "${{ secrets.DOCKER_PASSWORD }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          architecture: ${{ matrix.architecture }}
      - name: Install build tools from the Debian archive
        run: |
          sed -i -e '/bullseye-security/d' \
                 -e 's|deb.debian.org|archive.debian.org|g' \
                 /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "0";' > /etc/apt/apt.conf.d/99no-check-valid-until
          apt-get update && apt-get install -y ccache
      - uses: ./.github/actions/setup-native-build-cache
        with:
          key: native-prebuild-napi-v${{ env.NAPI_VERSION }}-linux-${{ matrix.architecture }}-glibc-${{ hashFiles('packages/native-with-source/binding.gyp', 'packages/native-with-source/src/**') }}
          restore-keys: native-prebuild-napi-v${{ env.NAPI_VERSION }}-linux-${{ matrix.architecture }}-glibc-
      - run: npm ci --ignore-scripts
      - name: Build canonical Node-API ${{ env.NAPI_VERSION }} prebuild
        run: npm exec --workspace=@muhammara/native-with-source -- node-pre-gyp rebuild
        env:
          npm_config_arch: ${{ matrix.architecture }}
          npm_config_target_arch: ${{ matrix.architecture }}
          npm_config_target_libc: glibc
          CFLAGS: ${{ matrix.extra_compile_flags }}
      - run: npm run package --workspace=@muhammara/native-with-source -- testpackage --target_arch=${{ matrix.architecture }} --target_libc=glibc
      - run: node .github/scripts/prepare-native-prebuild.mjs stage packages/native-with-source/build/stage napi-v${{ env.NAPI_VERSION }}-linux-${{ matrix.architecture }}-glibc.tar.gz canonical-upload
      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-napi-v${{ env.NAPI_VERSION }}-linux-${{ matrix.architecture }}-glibc
          path: canonical-upload/napi-v${{ env.NAPI_VERSION }}-linux-${{ matrix.architecture }}-glibc.tar.gz
          if-no-files-found: error

  build-prebuild-musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: x64
            image: node:20.19.0-alpine
          - runner: ubuntu-22.04
            architecture: arm64
            image: dockcross/linux-arm64-musl
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
      credentials:
        username: "${{ secrets.DOCKER_USERNAME }}"
        password: "${{ secrets.DOCKER_PASSWORD }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: matrix.architecture == 'arm64'
        with:
          node-version: 20.19.0
          architecture: x64
      - name: Install Alpine build tools
        if: matrix.architecture == 'x64'
        run: apk add --no-cache ccache make gcc g++ linux-headers perl python3
      - name: Install Dockcross build tools
        if: matrix.architecture == 'arm64'
        run: apt-get update && apt-get install -y ccache perl python3
      - uses: ./.github/actions/setup-native-build-cache
        with:
          key: native-prebuild-napi-v${{ env.NAPI_VERSION }}-linux-${{ matrix.architecture }}-musl-container-v2-${{ hashFiles('packages/native-with-source/binding.gyp', 'packages/native-with-source/src/**') }}
          restore-keys: native-prebuild-napi-v${{ env.NAPI_VERSION }}-linux-${{ matrix.architecture }}-musl-container-v2-
      - run: npm ci --ignore-scripts
      - name: Build canonical Node-API ${{ env.NAPI_VERSION }} prebuild
        run: npm exec --workspace=@muhammara/native-with-source -- node-pre-gyp rebuild
        env:
          npm_config_arch: ${{ matrix.architecture }}
          npm_config_target_arch: ${{ matrix.architecture }}
          npm_config_target_libc: musl
      - name: Package and load-test the native x64 prebuild
        if: matrix.architecture == 'x64'
        run: npm run package --workspace=@muhammara/native-with-source -- testpackage --target_arch=x64 --target_libc=musl
      # The cross-built addon cannot be loaded by the x64 host Node.
      # test-node-musl-arm64 runs this exact archive on native ARM64 Alpine.
      - name: Package the cross-built ARM64 prebuild
        if: matrix.architecture == 'arm64'
        run: npm run package --workspace=@muhammara/native-with-source -- --target_arch=arm64 --target_libc=musl
      - run: node .github/scripts/prepare-native-prebuild.mjs stage packages/native-with-source/build/stage napi-v${{ env.NAPI_VERSION }}-linux-${{ matrix.architecture }}-musl.tar.gz canonical-upload
      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-napi-v${{ env.NAPI_VERSION }}-linux-${{ matrix.architecture }}-musl
          path: canonical-upload/napi-v${{ env.NAPI_VERSION }}-linux-${{ matrix.architecture }}-musl.tar.gz
          if-no-files-found: error

  build-prebuild-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            architecture: x64
            architecture_node: x64
            libc: unknown
          - runner: macos-15
            platform: darwin
            architecture: arm64
            architecture_node: arm64
            libc: unknown
          - runner: windows-2022
            platform: win32
            architecture: x64
            architecture_node: x64
            libc: unknown
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          architecture: ${{ matrix.architecture_node }}
      - uses: ./.github/actions/setup-native-build-cache
        with:
          key: native-prebuild-napi-v${{ env.NAPI_VERSION }}-${{ matrix.platform }}-${{ matrix.architecture }}-${{ hashFiles('packages/native-with-source/binding.gyp', 'packages/native-with-source/src/**') }}
          restore-keys: native-prebuild-napi-v${{ env.NAPI_VERSION }}-${{ matrix.platform }}-${{ matrix.architecture }}-
      - name: Disable Node.js LTO (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "npm_config_enable_thin_lto=false"
          Add-Content -Path $env:GITHUB_ENV -Value "npm_config_enable_lto=false"
      - run: npm ci --ignore-scripts
      - name: Build canonical Node-API ${{ env.NAPI_VERSION }} prebuild
        run: npm exec --workspace=@muhammara/native-with-source -- node-pre-gyp rebuild
        env:
          npm_config_arch: ${{ matrix.architecture }}
          npm_config_target_arch: ${{ matrix.architecture }}
          npm_config_target_libc: ${{ matrix.libc }}
          npm_config_python: python3.10
      - run: npm run package --workspace=@muhammara/native-with-source -- testpackage --target_arch=${{ matrix.architecture }} --target_libc=${{ matrix.libc }}
      - run: node .github/scripts/prepare-native-prebuild.mjs stage packages/native-with-source/build/stage napi-v${{ env.NAPI_VERSION }}-${{ matrix.platform }}-${{ matrix.architecture }}-${{ matrix.libc }}.tar.gz canonical-upload
      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-napi-v${{ env.NAPI_VERSION }}-${{ matrix.platform }}-${{ matrix.architecture }}-${{ matrix.libc }}
          path: canonical-upload/napi-v${{ env.NAPI_VERSION }}-${{ matrix.platform }}-${{ matrix.architecture }}-${{ matrix.libc }}.tar.gz
          if-no-files-found: error
  test-electron:
    needs: [build-prebuild-glibc, build-prebuild-desktop]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            architecture: x64
            architecture_node: x64
            libc: glibc
            electron: 36.0.0
            node: 22.14.0
          - os: ubuntu-22.04
            platform: linux
            architecture: x64
            architecture_node: x64
            libc: glibc
            electron: 44.0.0
            node: 24.18.1
          - os: macos-15
            platform: darwin
            architecture: x64
            architecture_node: x64
            libc: unknown
            electron: 36.0.0
            node: 22.14.0
          - os: macos-15
            platform: darwin
            architecture: x64
            architecture_node: x64
            libc: unknown
            electron: 38.1.0
            node: 22.19.0
          - os: macos-15
            platform: darwin
            architecture: arm64
            architecture_node: arm64
            libc: unknown
            electron: 36.0.0
            node: 22.14.0
          - os: macos-15
            platform: darwin
            architecture: arm64
            architecture_node: arm64
            libc: unknown
            electron: 44.0.0
            node: 24.18.1
          - os: windows-2022
            platform: win32
            architecture: x64
            architecture_node: x64
            libc: unknown
            electron: 36.0.0
            node: 22.14.0
          - os: windows-2022
            platform: win32
            architecture: x64
            architecture_node: x64
            libc: unknown
            electron: 44.0.0
            node: 24.18.1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.architecture_node }}
      - name: Install Linux test tools
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-xserver-utils
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: prebuild-napi-v${{ env.NAPI_VERSION }}-${{ matrix.platform }}-${{ matrix.architecture }}-${{ matrix.libc }}
          path: canonical-prebuild
      - name: Install canonical prebuild
        run: node .github/scripts/prepare-native-prebuild.mjs canonical-prebuild/napi-v${{ env.NAPI_VERSION }}-${{ matrix.platform }}-${{ matrix.architecture }}-${{ matrix.libc }}.tar.gz napi-v${{ env.NAPI_VERSION }}-${{ matrix.platform }}-${{ matrix.architecture }}-${{ matrix.libc }}.tar.gz
      - name: Install Electron
        run: |
          npm install --workspace=@muhammara/native-with-source --no-save --ignore-scripts --cpu=${{ matrix.architecture }} electron@${{ matrix.electron }} electron-mocha@^13
          node node_modules/electron/install.js
        env:
          npm_config_arch: ${{ matrix.architecture }}
          npm_config_target_arch: ${{ matrix.architecture }}
      - run: node .github/scripts/prepare-native-prebuild.mjs verify
      - name: Run test with Xvfb
        if: ${{ runner.os == 'Linux' }}
        run: xvfb-run --auto-servernum npm run test:electron
      - name: Run test
        if: ${{ runner.os != 'Linux' }}
        run: npm run test:electron

  test-node-glibc:
    needs: build-prebuild-glibc
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
        node: [20.19.0, 26.8.1]
        include:
          - runner: ubuntu-22.04
            architecture: x64
          - runner: ubuntu-22.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: gcc:11-bullseye
      credentials:
        username: "${{ secrets.DOCKER_USERNAME }}"
        password: "${{ secrets.DOCKER_PASSWORD }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.architecture }}
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: prebuild-napi-v${{ env.NAPI_VERSION }}-linux-${{ matrix.architecture }}-glibc
          path: canonical-prebuild
      - run: node .github/scripts/prepare-native-prebuild.mjs canonical-prebuild/napi-v${{ env.NAPI_VERSION }}-linux-${{ matrix.architecture }}-glibc.tar.gz napi-v${{ env.NAPI_VERSION }}-linux-${{ matrix.architecture }}-glibc.tar.gz
      - run: npm run test
      - run: node .github/scripts/prepare-native-prebuild.mjs verify

  test-node-musl:
    needs: build-prebuild-musl
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04]
        node: [20.19.0, 26.8.1]
        include:
          - runner: ubuntu-22.04
            architecture: x64
    runs-on: ${{ matrix.runner }}
    container:
      image: node:${{ matrix.node }}-alpine
      credentials:
        username: "${{ secrets.DOCKER_USERNAME }}"
        password: "${{ secrets.DOCKER_PASSWORD }}"
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: prebuild-napi-v${{ env.NAPI_VERSION }}-linux-${{ matrix.architecture }}-musl
          path: canonical-prebuild
      - run: node .github/scripts/prepare-native-prebuild.mjs canonical-prebuild/napi-v${{ env.NAPI_VERSION }}-linux-${{ matrix.architecture }}-musl.tar.gz napi-v${{ env.NAPI_VERSION }}-linux-${{ matrix.architecture }}-musl.tar.gz
      - run: npm run test
      - run: node .github/scripts/prepare-native-prebuild.mjs verify

  test-node-musl-arm64:
    needs: build-prebuild-musl
    runs-on: ubuntu-22.04-arm
    strategy:
      fail-fast: false
      matrix:
        node: [20.19.0, 26.8.1]
    steps:
      # JavaScript actions run on Ubuntu; only the test commands run in Alpine.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: prebuild-napi-v${{ env.NAPI_VERSION }}-linux-arm64-musl
          path: canonical-prebuild
      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if test -n "$DOCKER_USERNAME" && test -n "$DOCKER_PASSWORD"; then
            echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin
          fi
      - name: Start native ARM64 Alpine test container
        run: docker run --detach --name musl-tests --volume "$PWD:/workspace" --workdir /workspace node:${{ matrix.node }}-alpine sleep infinity
      - name: Install test dependencies without rebuilding
        run: docker exec musl-tests npm ci --ignore-scripts
      - name: Install the canonical ARM64 musl prebuild
        run: docker exec musl-tests node .github/scripts/prepare-native-prebuild.mjs canonical-prebuild/napi-v${{ env.NAPI_VERSION }}-linux-arm64-musl.tar.gz napi-v${{ env.NAPI_VERSION }}-linux-arm64-musl.tar.gz
      - name: Run native tests in Alpine
        run: docker exec musl-tests npm test
      - name: Verify the tested prebuild is unchanged
        run: docker exec musl-tests node .github/scripts/prepare-native-prebuild.mjs verify
      - name: Remove the Alpine test container
        if: always()
        run: docker rm --force musl-tests

  test-node-desktop:
    needs: build-prebuild-desktop
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-x64, darwin-arm64, win32-x64]
        node: [20.19.0, 26.8.1]
        include:
          - target: darwin-x64
            runner: macos-15
            platform: darwin
            architecture: x64
            architecture_node: x64
            libc: unknown
          - target: darwin-arm64
            runner: macos-15
            platform: darwin
            architecture: arm64
            architecture_node: arm64
            libc: unknown
          - target: win32-x64
            runner: windows-2022
            platform: win32
            architecture: x64
            architecture_node: x64
            libc: unknown
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.architecture_node }}
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: prebuild-napi-v${{ env.NAPI_VERSION }}-${{ matrix.platform }}-${{ matrix.architecture }}-${{ matrix.libc }}
          path: canonical-prebuild
      - run: node .github/scripts/prepare-native-prebuild.mjs canonical-prebuild/napi-v${{ env.NAPI_VERSION }}-${{ matrix.platform }}-${{ matrix.architecture }}-${{ matrix.libc }}.tar.gz napi-v${{ env.NAPI_VERSION }}-${{ matrix.platform }}-${{ matrix.architecture }}-${{ matrix.libc }}.tar.gz
      - run: npm run test
      - run: node .github/scripts/prepare-native-prebuild.mjs verify
  publish:
    needs:
      [
        packed-source-fallback,
        sanitizer,
        build-prebuild-glibc,
        build-prebuild-musl,
        build-prebuild-desktop,
        test-electron,
        test-node-glibc,
        test-node-musl,
        test-node-musl-arm64,
        test-node-desktop,
      ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/native-v')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global npm@11.5.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r packages/native/docs/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: prebuild-napi-v${{ env.NAPI_VERSION }}-linux-x64-glibc
          path: canonical-prebuild
      - run: node .github/scripts/prepare-native-prebuild.mjs canonical-prebuild/napi-v${{ env.NAPI_VERSION }}-linux-x64-glibc.tar.gz napi-v${{ env.NAPI_VERSION }}-linux-x64-glibc.tar.gz
      - run: npm run test:codestyle
      - run: npm run docs:check
      - uses: actions/download-artifact@v8
        with:
          pattern: prebuild-napi-v${{ env.NAPI_VERSION }}-*
          path: builds/release
          merge-multiple: true
      - name: Verify package version
        run: test "$(node -p "require('./packages/native-core/package.json').version")" = "${GITHUB_REF_NAME#native-v}" && test "$(node -p "require('./packages/native/package.json').version")" = "${GITHUB_REF_NAME#native-v}" && test "$(node -p "require('./packages/native-with-source/package.json').version")" = "${GITHUB_REF_NAME#native-v}"
      - id: npm-tag
        run: |
          case "${GITHUB_REF_NAME#native-v}" in
            *-alpha.*) echo "value=alpha" >> "$GITHUB_OUTPUT" ;;
            *-beta.*) echo "value=beta" >> "$GITHUB_OUTPUT" ;;
            *-rc.*) echo "value=rc" >> "$GITHUB_OUTPUT" ;;
            *) echo "value=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Verify canonical release prebuilds
        run: |
          expected=(
            napi-v${NAPI_VERSION}-linux-x64-glibc.tar.gz
            napi-v${NAPI_VERSION}-linux-arm64-glibc.tar.gz
            napi-v${NAPI_VERSION}-linux-x64-musl.tar.gz
            napi-v${NAPI_VERSION}-linux-arm64-musl.tar.gz
            napi-v${NAPI_VERSION}-darwin-x64-unknown.tar.gz
            napi-v${NAPI_VERSION}-darwin-arm64-unknown.tar.gz
            napi-v${NAPI_VERSION}-win32-x64-unknown.tar.gz
          )
          test "$(find builds/release -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq "${#expected[@]}"
          for filename in "${expected[@]}"; do
            test -f "builds/release/$filename"
          done
          ls -lah builds/release/
      - name: Create release and upload prebuilds
        uses: softprops/action-gh-release@v3
        with:
          files: "builds/release/*"
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ steps.npm-tag.outputs.value != 'latest' }}
      - id: pending
        name: Select packages the registry does not serve yet
        run: |
          pending=""
          for workspace in @muhammara/native-core @muhammara/native-with-source @muhammara/native; do
            if npm view "$workspace@${GITHUB_REF_NAME#native-v}" version >/dev/null 2>&1; then
              echo "$workspace@${GITHUB_REF_NAME#native-v} is already published"
            else
              pending="$pending $workspace"
            fi
          done
          echo "workspaces=$pending" >> "$GITHUB_OUTPUT"
      - name: Verify native package publish preflight
        if: steps.pending.outputs.workspaces != ''
        run: |
          for workspace in ${{ steps.pending.outputs.workspaces }}; do
            npm publish --workspace="$workspace" --ignore-scripts --provenance --dry-run --access public --tag ${{ steps.npm-tag.outputs.value }}
          done
      - name: Publish native packages
        if: steps.pending.outputs.workspaces != ''
        run: |
          for workspace in ${{ steps.pending.outputs.workspaces }}; do
            npm publish --workspace="$workspace" --ignore-scripts --provenance --access public --tag ${{ steps.npm-tag.outputs.value }}
          done
  tag-docs:
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/native-v')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create matching native documentation tag
        run: |
          DOC_TAG="native-doc-v${GITHUB_REF_NAME#native-v}"
          if git ls-remote --exit-code --tags origin "refs/tags/$DOC_TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$DOC_TAG:refs/tags/$DOC_TAG"
            test "$(git rev-list -n 1 "$DOC_TAG")" = "$GITHUB_SHA"
          else
            git tag "$DOC_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$DOC_TAG"
          fi
          gh workflow run docs.yml --ref "$DOC_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
