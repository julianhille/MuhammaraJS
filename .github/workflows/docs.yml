name: Documentation

on:
  pull_request:
  push:
    branches:
      - develop
    tags:
      - "native-doc-v*"
      - "wasm-doc-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/setup-native-build-cache
        with:
          key: native-docs-${{ hashFiles('packages/native-with-source/binding.gyp', 'packages/native-with-source/src/**') }}
          restore-keys: native-docs-
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r packages/native/docs/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y curl perl
      - run: npm ci --ignore-scripts
      - run: npm exec --workspace=@muhammara/native-with-source -- node-pre-gyp rebuild
      - run: npm run test:docs
      - run: npm run docs:check
      - run: npm run docs:check --workspace=@muhammara/wasm
