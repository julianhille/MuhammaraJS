name: Wasm CI

on:
  push:
    branches:
      - develop
    tags:
      - "wasm-v*"
  pull_request:
    paths:
      - ".github/workflows/ci-wasm.yml"
      - ".github/workflows/ci-native.yml"
      - ".github/actions/setup-wasm-build-cache/**"
      - "package.json"
      - "package-lock.json"
      - "packages/native-with-source/src/**"
      - "packages/wasm/**"
      - "!packages/wasm/docs/**"
      - "!packages/wasm/mkdocs.yml"
      - "!packages/wasm/.readthedocs.yaml"
  workflow_dispatch:

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js and restore npm cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/setup-wasm-build-cache
        with:
          sanitize: "OFF"
      - run: npm ci --ignore-scripts
      - run: npm run wasm:build
      - name: Verify Wasm package contents
        run: npm pack --workspace=@muhammara/wasm --ignore-scripts --dry-run --json | node packages/wasm/scripts/check-package-contents.mjs
      - uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: muhammara-wasm
          path: packages/wasm/dist/
          if-no-files-found: error
  test:
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js and restore npm cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: muhammara-wasm
          path: packages/wasm/dist
      - run: npm run wasm:verify
      - run: npm run wasm:test
      - run: npm run wasm:test:types
      - run: npm run wasm:test:paths
      - run: npm run wasm:test:exports
      - run: npm run wasm:test:manifests
      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
        with:
          chrome-version: stable
          install-dependencies: true
      - run: npm run wasm:test:browser
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
  sanitizer:
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js and restore npm cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/setup-wasm-build-cache
        with:
          sanitize: "ON"
      - run: npm ci --ignore-scripts
      - name: Build with Emscripten LeakSanitizer
        run: npm run wasm:build
        env:
          MUHAMMARA_WASM_SANITIZE: ON
          MUHAMMARA_WASM_BUILD_TESTS: ON
      - run: npm run wasm:test
  deploy-development-example:
    needs: [build, test, sanitizer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-22.04
    concurrency:
      group: wasm-example-pages
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r packages/wasm/docs/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: muhammara-wasm
          path: packages/wasm/dist
      - run: npm run pages:stage-example --workspace=@muhammara/wasm
      - id: pages
        uses: actions/configure-pages@v6
      - name: Fetch existing example versions
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
          fi
      - name: Deploy development example
        run: |
          mike deploy --config-file packages/wasm/mkdocs-example.yml --deploy-prefix wasm/browser-example --push --update-aliases --alias-type redirect dev
          mike set-default --config-file packages/wasm/mkdocs-example.yml --deploy-prefix wasm/browser-example --push dev
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          MUHAMMARA_WASM_EXAMPLE_SITE_URL: ${{ steps.pages.outputs.base_url }}/wasm/browser-example/
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v5
  publish:
    needs: [test, sanitizer]
    if: startsWith(github.ref, 'refs/tags/wasm-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js and restore npm cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.5.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: test "$(node -p "require('./packages/wasm/package.json').version")" = "${GITHUB_REF_NAME#wasm-v}"
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r packages/wasm/docs/requirements.txt
      - run: npm run test:codestyle
      - run: npm run docs:check --workspace=@muhammara/wasm
      - uses: actions/download-artifact@v8
        with:
          name: muhammara-wasm
          path: packages/wasm/dist
      - name: Verify Wasm package contents
        run: npm pack --workspace=@muhammara/wasm --ignore-scripts --dry-run --json | node packages/wasm/scripts/check-package-contents.mjs
      - id: npm-tag
        run: |
          case "${GITHUB_REF_NAME#wasm-v}" in
            *-alpha.*) echo "value=alpha" >> "$GITHUB_OUTPUT" ;;
            *-beta.*) echo "value=beta" >> "$GITHUB_OUTPUT" ;;
            *-rc.*) echo "value=rc" >> "$GITHUB_OUTPUT" ;;
            *) echo "value=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: packages/wasm/dist/*
          draft: false
          prerelease: ${{ steps.npm-tag.outputs.value != 'latest' }}
      - id: published
        name: Check whether the registry serves this version already
        run: |
          if npm view "@muhammara/wasm@${GITHUB_REF_NAME#wasm-v}" version >/dev/null 2>&1; then
            echo "@muhammara/wasm@${GITHUB_REF_NAME#wasm-v} is already published"
            echo "value=yes" >> "$GITHUB_OUTPUT"
          else
            echo "value=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify Wasm package publish preflight
        if: steps.published.outputs.value == 'no'
        run: npm publish --workspace=@muhammara/wasm --ignore-scripts --provenance --dry-run --access public --tag ${{ steps.npm-tag.outputs.value }}
      - name: Publish Wasm package
        if: steps.published.outputs.value == 'no'
        run: npm publish --workspace=@muhammara/wasm --ignore-scripts --provenance --access public --tag ${{ steps.npm-tag.outputs.value }}
  deploy-release-docs-and-example:
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/wasm-v')
    runs-on: ubuntu-22.04
    concurrency:
      group: wasm-example-pages
    permissions:
      actions: write
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r packages/wasm/docs/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: muhammara-wasm
          path: packages/wasm/dist
      - run: npm run pages:stage-example --workspace=@muhammara/wasm
      - id: pages
        uses: actions/configure-pages@v6
      - name: Fetch existing example versions
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
          fi
      - id: example-version
        name: Select example version and alias
        run: |
          VERSION="${GITHUB_REF_NAME#wasm-v}"
          case "$VERSION" in
            *-alpha.*) ALIAS=alpha ;;
            *-beta.*) ALIAS=beta ;;
            *-rc.*) ALIAS=rc ;;
            *) ALIAS=latest ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
      - name: Deploy release example
        run: |
          VERSION="${{ steps.example-version.outputs.version }}"
          ALIAS="${{ steps.example-version.outputs.alias }}"
          # A missing gh-pages branch leaves jq with empty input, which reads as
          # "already deployed" and skips the deploy that creates the branch.
          if git rev-parse --verify --quiet refs/remotes/origin/gh-pages >/dev/null && git show origin/gh-pages:wasm/browser-example/versions.json 2>/dev/null | jq --exit-status --arg version "$VERSION" 'any(.[]; .version == $version)' >/dev/null; then
            echo "Example version $VERSION is already deployed"
          elif test "$(npm view @muhammara/wasm "dist-tags.$ALIAS")" = "$VERSION"; then
            mike deploy --config-file packages/wasm/mkdocs-example.yml --deploy-prefix wasm/browser-example --push --update-aliases --alias-type redirect "$VERSION" "$ALIAS"
          else
            mike deploy --config-file packages/wasm/mkdocs-example.yml --deploy-prefix wasm/browser-example --push "$VERSION"
          fi
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          MUHAMMARA_WASM_EXAMPLE_SITE_URL: ${{ steps.pages.outputs.base_url }}/wasm/browser-example/
      - name: Create matching Wasm documentation tag
        run: |
          DOC_TAG="wasm-doc-v${GITHUB_REF_NAME#wasm-v}"
          if git ls-remote --exit-code --tags origin "refs/tags/$DOC_TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$DOC_TAG:refs/tags/$DOC_TAG"
            test "$(git rev-list -n 1 "$DOC_TAG")" = "$GITHUB_SHA"
          else
            git tag "$DOC_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$DOC_TAG"
          fi
          gh workflow run docs.yml --ref "$DOC_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v5
