name: Build

on:
  push:
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-22.04
    env:
      node_version: 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.node_version }}
      - run: npm ci --ignore-scripts
      - run: npm run test:codestyle
  build-musl-arm:
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        node: [20.9.0, 22.0.0, 24.0.0, 25.0.0]
        include:
          - architecture: arm64
            architecture_node: x64
            target_architecture: arm64
            extra_compile_flags: -march=armv8-a
          - python_version: 3
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64-musl
      credentials:
        username: "${{ secrets.DOCKER_USERNAME }}"
        password: "${{ secrets.DOCKER_PASSWORD }}"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.architecture_node }}
      - run: apt-get install -y python${{ matrix.python_version }}
      - run: node --version
      - run: npm --version
      - run: chmod 0777 tests/output/
      - name: Get npm cache directory
        id: npm-cache-dir
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}
      - uses: actions/cache@v5
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-musl-arm-${{ matrix.node }}-${{ hashFiles('**/package-lock.json') }}
      - run: npm install --build-from-source
        env:
          npm_config_arch: ${{ matrix.architecture }}
          npm_config_target_arch: ${{ matrix.target_architecture }}
          CFLAGS: ${{ matrix.extra_compile_flags }}
          CPPFLAGS: ${{ env.CPPFLAGS }} ${{ matrix.extra_compile_flags }}
          EXTRA_NODE_PRE_GYP_FLAGS: --target_libc=musl
          npm_config_unsafe_perm: true
      # - run: npm run test, this is not an arm64 machine so we can not test.
      - run: ./node_modules/.bin/node-pre-gyp package --target_libc=musl  --target_arch=${{ matrix.target_architecture }}
      - uses: actions/upload-artifact@v6
        with:
          path: build/stage/julianhille/MuhammaraJS/releases/download/**/*.gz
          name: bindings-node-musl-arm-${{ matrix.node }}
          if-no-files-found: error
  build-musl:
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        node: [20.9.0, 22.0.0, 24.0.0, 25.0.0]
        include:
          - python_version: 3
    runs-on: ubuntu-latest
    container:
      image: node:${{ matrix.node }}-alpine
      credentials:
        username: "${{ secrets.DOCKER_USERNAME }}"
        password: "${{ secrets.DOCKER_PASSWORD }}"
    steps:
      - uses: actions/checkout@v6
      - run: apk update
      - run: apk add --no-cache make gcc jq g++ python${{ matrix.python_version }} tar
      - run: node --version
      - run: npm --version
      - run: chmod 0777 tests/output/
      - name: Get npm cache directory
        id: npm-cache-dir
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}
      - uses: actions/cache@v5
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-musl-${{ matrix.node }}-${{ hashFiles('**/package-lock.json') }}
      - run: npm install --build-from-source
        env:
          EXTRA_NODE_PRE_GYP_FLAGS: --target_libc=musl
          npm_config_unsafe_perm: true
      - run: npm run test
      - run: ./node_modules/.bin/node-pre-gyp package testpackage --target_libc=musl
      - uses: actions/upload-artifact@v6
        with:
          path: build/stage/julianhille/MuhammaraJS/releases/download/**/*.gz
          name: bindings-node-musl-${{ matrix.node }}
          if-no-files-found: error
  build-electron:
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
        architecture: [x64, arm64]
        electron:
          - 36.0.0
          - 36.1.0
          - 36.2.0
          - 36.3.0
          - 36.4.0
          - 36.5.0
          - 36.6.0
          - 36.7.0
          - 36.8.0
          - 36.9.0
          - 37.0.0
          - 37.1.0
          - 37.2.0
          - 37.3.0
          - 37.4.0
          - 37.5.0
          - 38.0.0
          - 38.1.0
        include:
          - electron_mocha_version: ^13
            python_version: "3.10"
          - architecture: arm64
            architecture_node: x64
            target_architecture: arm64
            extra_compile_flags: -arch arm64
          - architecture: x64
            architecture_node: x64
            target_architecture: x64
          - electron: 36.0.0
            node: 22.14.0
          - electron: 36.1.0
            node: 22.14.0
          - electron: 36.2.0
            node: 22.15.0
          - electron: 36.3.0
            node: 22.15.1
          - electron: 36.4.0
            node: 22.15.1
          - electron: 36.5.0
            node: 22.16.0
          - electron: 36.6.0
            node: 22.16.0
          - electron: 36.7.0
            node: 22.17.0
          - electron: 36.8.0
            node: 22.18.0
          - electron: 36.9.0
            node: 22.19.0
          - electron: 37.0.0
            node: 22.16.0
          - electron: 37.1.0
            node: 22.16.0
          - electron: 37.2.0
            node: 22.17.0
          - electron: 37.3.0
            node: 22.18.0
          - electron: 37.4.0
            node: 22.18.0
          - electron: 37.5.0
            node: 22.19.0
          - electron: 38.0.0
            node: 22.18.0
          - electron: 38.1.0
            node: 22.19.0
        exclude:
          - os: ubuntu-22.04
            architecture: arm64
          - os: windows-2022
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up GCC
        uses: egor-tensin/setup-gcc@v1
        with:
          version: 11
          platform: ${{matrix.architecture}}
        if: ${{ matrix.os == 'ubuntu-22.04' }}
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.architecture_node }}
      - run: node --version
      - run: npm --version
      - name: Configure OpenSSL (Windows)
        if: ${{ matrix.os == 'windows-2022' }}
        shell: powershell
        run: |
          $opensslRoot = 'C:\Program Files\OpenSSL'
          if (-not (Test-Path $opensslRoot -PathType Container)) {
            Write-Error "Expected OpenSSL folder at $opensslRoot"
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_DIR=$opensslRoot"
      - name: Configure OpenSSL (macOS)
        if: ${{ matrix.os == 'macos-15' }}
        run: |
          OPENSSL_PREFIX=$(brew --prefix openssl@3 2>/dev/null || true)
          if [ -z "$OPENSSL_PREFIX" ] || [ ! -d "$OPENSSL_PREFIX" ]; then
            echo "::error ::Expected openssl@3 to be preinstalled on the runner." >&2
            exit 1
          fi
          echo "LDFLAGS=-L$OPENSSL_PREFIX/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I$OPENSSL_PREFIX/include" >> $GITHUB_ENV
          echo "OPENSSL_DIR=$OPENSSL_PREFIX" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_PREFIX/include" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$OPENSSL_PREFIX/lib" >> $GITHUB_ENV
      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}
      - uses: actions/cache@v5
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-electron-${{ matrix.target_architecture }}-${{ matrix.architecture }}-${{ matrix.electron }}-${{ hashFiles('**/package-lock.json') }}
      - run: |
          npm install --cpu=${{ matrix.architecture }} --build-from-source
        env:
          npm_config_arch: ${{ matrix.architecture }}
          npm_config_msbuild_path: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
          npm_config_target_arch: ${{ matrix.target_architecture }}
          npm_config_target: ${{ matrix.electron }}
          npm_config_disturl: https://artifacts.electronjs.org/headers/dist
          npm_config_runtime: electron
          npm_config_python: python${{ matrix.python_version }}
          CFLAGS: ${{ matrix.extra_compile_flags }}
          CPPFLAGS: ${{ env.CPPFLAGS }} ${{ matrix.extra_compile_flags }}
      - name: Install electron
        run: |
          npm install --cpu=${{ matrix.architecture }} electron@${{ matrix.electron }} electron-mocha@${{ matrix.electron_mocha_version }}
        env:
          npm_config_arch: ${{ matrix.architecture }}
          npm_config_msbuild_path: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
          npm_config_target_arch: ${{ matrix.target_architecture }}
          npm_config_target: ${{ matrix.electron }}
          npm_config_disturl: https://artifacts.electronjs.org/headers/dist
          npm_config_runtime: electron
          npm_config_python: python${{ matrix.python_version }}
          CFLAGS: ${{ matrix.extra_compile_flags }}
          CPPFLAGS: ${{ env.CPPFLAGS }} ${{ matrix.extra_compile_flags }}
      - name: Bundle OpenSSL DLLs (Windows)
        if: ${{ matrix.os == 'windows-2022' }}
        shell: pwsh
        run: |
          $binPath = Join-Path $env:OPENSSL_DIR 'bin'
          $cryptoDll = @(Get-ChildItem -Path $binPath -Filter 'libcrypto-3*.dll' -File)
          $sslDll = @(Get-ChildItem -Path $binPath -Filter 'libssl-3*.dll' -File)
          if ($cryptoDll.Count -ne 1 -or $sslDll.Count -ne 1) {
            throw "Expected one libcrypto-3*.dll and one libssl-3*.dll in $binPath"
          }
          $openssl = Join-Path $binPath 'openssl.exe'
          $opensslVersion = if (Test-Path $openssl -PathType Leaf) {
            & $openssl version
          } else {
            $cryptoDll.VersionInfo.ProductVersion
          }
          if ([string]::IsNullOrWhiteSpace($opensslVersion)) {
            throw 'Unable to determine the bundled OpenSSL version'
          }
          Copy-Item $cryptoDll.FullName, $sslDll.FullName -Destination binding -Force
          Copy-Item THIRD_PARTY_NOTICES.md -Destination binding -Force
          Set-Content -Path binding/OPENSSL_VERSION.txt -Value $opensslVersion
      - name: Run test
        uses: coactions/setup-xvfb@90473c3ebc69533a1a6e0505c36511b69c8c3135
        with:
          run: npm run test:electron
        if: ${{ matrix.target_architecture != 'arm64' }}
      - run: ./node_modules/.bin/node-pre-gyp package testpackage
        env:
          npm_config_runtime: electron
          npm_config_target: ${{ matrix.electron }}
        if: ${{ matrix.target_architecture != 'arm64' }}
      - run: ./node_modules/.bin/node-pre-gyp package --target_arch=${{ matrix.target_architecture }}
        if: ${{ matrix.target_architecture == 'arm64' }}
        env:
          npm_config_runtime: electron
          npm_config_target: ${{ matrix.electron }}
      - uses: actions/upload-artifact@v6
        with:
          path: build/stage/julianhille/MuhammaraJS/releases/download/**/*.gz
          name: bindings-electron-${{ matrix.os }}-${{ matrix.target_architecture }}-${{matrix.electron}}
          if-no-files-found: error

  build-node-linux:
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
        node: [20.9.0, 22.9.0, 24.0.0, 25.2.0]
        include:
          - os: ubuntu-22.04
            architecture: x64
            architecture_node: x64
            target_architecture: x64
          - os: ubuntu-22.04-arm
            architecture: arm64
            architecture_node: arm64
            target_architecture: arm64
            extra_compile_flags: -march=armv8-a
    runs-on: ${{ matrix.os }}
    container:
      image: gcc:11-bullseye
      credentials:
        username: "${{ secrets.DOCKER_USERNAME }}"
        password: "${{ secrets.DOCKER_PASSWORD }}"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.architecture_node }}
      - run: node --version
      - run: npm --version
      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}
      - uses: actions/cache@v5
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ matrix.architecture }}-${{ matrix.target_architecture }}-${{matrix.node}}-${{ hashFiles('**/package-lock.json') }}
      - run: npm install --build-from-source
        env:
          npm_config_arch: ${{ matrix.architecture }}
          npm_config_target_arch: ${{ matrix.target_architecture }}
          CFLAGS: ${{ matrix.extra_compile_flags }}
          CPPFLAGS: ${{ env.CPPFLAGS }} ${{ matrix.extra_compile_flags }}
      - run: ./node_modules/.bin/node-pre-gyp package testpackage
      - uses: actions/upload-artifact@v6
        with:
          path: build/stage/julianhille/MuhammaraJS/releases/download/**/*.gz
          name: bindings-electron-${{ matrix.os }}-${{ matrix.target_architecture }}-${{matrix.node}}
          if-no-files-found: error
  build-node:
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
        node: [20.9.0, 22.9.0, 24.0.0, 25.2.0]
        architecture: [x64, arm64]
        include:
          - python_version: "3.10"
          - architecture: x64
            architecture_node: x64
            target_architecture: x64
          - architecture: arm64
            architecture_node: x64
            target_architecture: arm64
            extra_compile_flags: -arch arm64
            EXTRA_NODE_PRE_GYP_FLAGS: --target_arch=arm64
        exclude:
          - os: windows-2022
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.architecture_node }}
      - run: node --version
      - run: npm --version
      - name: Configure OpenSSL (macOS)
        if: ${{ matrix.os == 'macos-15' }}
        run: |
          OPENSSL_PREFIX=$(brew --prefix openssl@3 2>/dev/null || true)
          if [ -z "$OPENSSL_PREFIX" ] || [ ! -d "$OPENSSL_PREFIX" ]; then
            echo "::error ::Expected openssl@3 to be preinstalled on the runner." >&2
            exit 1
          fi
          echo "LDFLAGS=-L$OPENSSL_PREFIX/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I$OPENSSL_PREFIX/include" >> $GITHUB_ENV
          echo "OPENSSL_DIR=$OPENSSL_PREFIX" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_PREFIX/include" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$OPENSSL_PREFIX/lib" >> $GITHUB_ENV
      - name: Configure OpenSSL (Windows)
        if: ${{ matrix.os == 'windows-2022' }}
        shell: powershell
        run: |
          $opensslRoot = 'C:\Program Files\OpenSSL'
          if (-not (Test-Path $opensslRoot -PathType Container)) {
            Write-Error "Expected OpenSSL folder at $opensslRoot"
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_DIR=$opensslRoot"
      - name: Disable Node.js LTO (Windows)
        if: ${{ matrix.os == 'windows-2022' }}
        shell: powershell
        run: |
          # Node 26's ThinLTO settings target clang-cl and lld, not MSVC.
          Add-Content -Path $env:GITHUB_ENV -Value "npm_config_enable_thin_lto=false"
          Add-Content -Path $env:GITHUB_ENV -Value "npm_config_enable_lto=false"
      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}
      - uses: actions/cache@v5
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ matrix.architecture }}-${{ matrix.target_architecture }}-${{matrix.node}}-${{ hashFiles('**/package-lock.json') }}
      - run: npm install --build-from-source
        env:
          npm_config_arch: ${{ matrix.architecture }}
          npm_config_target_arch: ${{ matrix.target_architecture }}
          npm_config_python: python${{ matrix.python_version }}
          npm_config_msbuild_path: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
          CFLAGS: ${{ matrix.extra_compile_flags }}
          CPPFLAGS: ${{ env.CPPFLAGS }} ${{ matrix.extra_compile_flags }}
      - name: Bundle OpenSSL DLLs (Windows)
        if: ${{ matrix.os == 'windows-2022' }}
        shell: pwsh
        run: |
          $binPath = Join-Path $env:OPENSSL_DIR 'bin'
          $cryptoDll = @(Get-ChildItem -Path $binPath -Filter 'libcrypto-3*.dll' -File)
          $sslDll = @(Get-ChildItem -Path $binPath -Filter 'libssl-3*.dll' -File)
          if ($cryptoDll.Count -ne 1 -or $sslDll.Count -ne 1) {
            throw "Expected one libcrypto-3*.dll and one libssl-3*.dll in $binPath"
          }
          $openssl = Join-Path $binPath 'openssl.exe'
          $opensslVersion = if (Test-Path $openssl -PathType Leaf) {
            & $openssl version
          } else {
            $cryptoDll.VersionInfo.ProductVersion
          }
          if ([string]::IsNullOrWhiteSpace($opensslVersion)) {
            throw 'Unable to determine the bundled OpenSSL version'
          }
          Copy-Item $cryptoDll.FullName, $sslDll.FullName -Destination binding -Force
          Copy-Item THIRD_PARTY_NOTICES.md -Destination binding -Force
          Set-Content -Path binding/OPENSSL_VERSION.txt -Value $opensslVersion
      - run: npm run test
        if: ${{ matrix.target_architecture != 'arm64' }}
      - run: ./node_modules/.bin/node-pre-gyp package testpackage
        if: ${{ matrix.target_architecture != 'arm64' }}
      - run: ./node_modules/.bin/node-pre-gyp package --target_arch=${{ matrix.target_architecture }}
        if: ${{ matrix.target_architecture == 'arm64' }}
      - uses: actions/upload-artifact@v6
        with:
          path: build/stage/julianhille/MuhammaraJS/releases/download/**/*.gz
          name: bindings-electron-${{ matrix.os }}-${{ matrix.target_architecture }}-${{matrix.node}}
          if-no-files-found: error
  publish:
    needs: [build-musl, build-musl-arm, build-electron, build-node]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: builds/bindings
        id: upload-release-asset
      - run: ls -lah builds/bindings/
      - name: Parse semver string
        id: semver_parser
        uses: booxmedialtd/ws-action-parse-semver@v1
        with:
          input_string: ${{ github.ref }}
          version_extractor_regex: 'tags\/(.*)$'
      - name: Create Release
        id: create_release
        uses: actions/create-release@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.semver_parser.outputs.fullversion }}
          release_name: ${{ steps.semver_parser.outputs.fullversion }}
          draft: false
          prerelease: steps.semver_parser.outputs.prerelease != []
      - uses: AButler/upload-release-assets@v2.0
        with:
          files: "builds/bindings/**/*"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          release-tag: ${{ steps.semver_parser.outputs.fullversion }}
      - run: npm install
      - uses: JS-DevTools/npm-publish@v1
        with:
          token: ${{ secrets.NPM_TOKEN }}
