version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@muhammara/*"

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directories:
      - /packages/native/docs
      - /packages/wasm/docs
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docs-requirements:
        patterns:
          - "*"
