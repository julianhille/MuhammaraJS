site_name: MuhammaraJS WebAssembly Documentation
site_description: Documentation for the MuhammaraJS WebAssembly PDF package.
site_url: https://muhammarajs-wasm.readthedocs.io/
use_directory_urls: false
exclude_docs: |
  /requirements.txt
repo_name: julianhille/MuhammaraJS
repo_url: https://github.com/julianhille/MuhammaraJS
edit_uri: edit/develop/packages/wasm/docs/

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.tabs
    - search.highlight
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  links:
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Getting Started:
      - Browser Setup: browser-setup.md
      - Byte Assets, Blob, and File Input: byte-assets.md
  - Browser Examples: browser-examples.md
  - High-Level Recipe:
      - Overview: recipe/index.md
      - Create PDFs: recipe/create-pdfs.md
      - Pages And Positioning: recipe/pages-and-positioning.md
      - Text And Fonts: recipe/text-and-fonts.md
      - Colors, Shapes, And Vectors: recipe/colors-shapes-and-vectors.md
      - Compose PDFs: recipe/compose-pdfs.md
      - Modify And Inspect PDFs: recipe/modify-and-inspect.md
      - Metadata And Custom Data: recipe/metadata-and-custom-data.md
      - API Invariants: recipe/invariants.md
      - Encryption: recipe/encryption.md
  - Low-Level API: low-level.md
  - API Reference: reference.md
  - How-To Guides:
      - Overview: how-to/index.md
      - Preview, Download, or Upload a PDF: how-to/serve-a-pdf-response.md
      - Add Review Annotations: how-to/add-review-annotations.md
      - Edit or Remove an Existing Annotation: how-to/edit-existing-annotations.md
      - Create Multi-Page Tables: how-to/create-tables.md
      - Render HTML Lists: how-to/render-html-lists.md
      - Create a Pie Chart: how-to/create-pie-charts.md
      - Flow Text into Columns: how-to/flow-text-into-columns.md
      - Watermark Every Page: how-to/watermark-pdfs.md
      - Find Text Positions: how-to/find-text-positions.md
      - Add Clickable URL Links: how-to/add-url-links.md
      - Change PDF Passwords: how-to/change-pdf-passwords.md
      - Add Metadata to an Existing PDF: how-to/add-metadata-to-existing-pdfs.md
      - Add Content to Rotated Pages: how-to/add-content-to-rotated-pages.md
      - Place and Transform Images: how-to/place-and-transform-images.md
      - Set Page Boxes: how-to/set-page-boxes.md
  - Compatibility: differences.md
  - Project:
      - Development: development.md
      - Security: security.md
      - Documentation Sources: provenance.md
      - Contributing Documentation: contributing.md
  - Breaking Changes: breaking-changes.md
