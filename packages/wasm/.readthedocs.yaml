version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    nodejs: "24"
  jobs:
    pre_build:
      - npm ci --ignore-scripts
      - node packages/wasm/scripts/download-wasm-artifact.mjs
      - REQUIRE_WASM_DIST=1 npm run docs:stage-browser-example --workspace=@muhammara/wasm
      - npm run docs:generate --workspace=@muhammara/wasm

mkdocs:
  configuration: packages/wasm/mkdocs.yml
  fail_on_warning: true

python:
  install:
    - requirements: packages/wasm/docs/requirements.txt
