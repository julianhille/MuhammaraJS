version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    nodejs: "24"
  jobs:
    pre_build:
      - npm ci --ignore-scripts
      - npm run docs:generate --workspace=@muhammara/native

mkdocs:
  configuration: packages/native/mkdocs.yml
  fail_on_warning: true

python:
  install:
    - requirements: packages/native/docs/requirements.txt
